services:
  backend:
    build: ./backend
    container_name: backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      FLASK_APP: presentation/api/main.py
      FLASK_ENV: development
      PYTHONPATH: /app
    volumes:
      - ./backend:/app
    depends_on:
      - mongo
    command: flask run --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:80"
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: "8000"
    depends_on:
      - backend

  mongo:
    image: mongo:7.0
    container_name: mongo
    ports:
      - "27017:27017"
    env_file:
      - ./backend/.env
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: